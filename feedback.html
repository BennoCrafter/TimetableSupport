<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script src="assets/js/theme.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Feedback - Timetable Manager</title>
        <meta name="description" content="Found a bug or have an idea for Timetable Manager? Send us your feedback or a feature request." />
        <link rel="canonical" href="https://www.timetablemanager.app/feedback" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Timetable Manager" />
        <meta property="og:title" content="Feedback - Timetable Manager" />
        <meta property="og:description" content="Found a bug or have an idea for Timetable Manager? Send us your feedback or a feature request." />
        <meta property="og:url" content="https://www.timetablemanager.app/feedback" />
        <meta property="og:image" content="https://www.timetablemanager.app/assets/images/screenshots/hero/en/dashboard.webp" />
        <meta property="og:image:width" content="1600" />
        <meta property="og:image:height" content="1200" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap"
          rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
        <style>
            .feedback-shell {
                padding: 56px 0 96px;
            }

            .feedback-shell .wrap {
                max-width: 560px;
            }

            .form-container {
                background-color: var(--surface);
                border: 1px solid var(--border);
                padding: 32px;
                border-radius: var(--radius-lg);
            }

            .form-container h1 {
                margin: 0 0 8px;
                font-size: 26px;
                letter-spacing: -0.01em;
            }

            .form-container > p.form-intro {
                color: var(--muted);
                margin: 0 0 26px;
                font-size: 15px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
                font-size: 14px;
                color: var(--ink);
            }

            input,
            textarea,
            select {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                font-size: 15px;
                font-family: var(--font);
                transition: border 0.15s ease, box-shadow 0.15s ease;
                background-color: var(--surface);
                color: var(--ink);
            }

            select {
                appearance: none;
                -webkit-appearance: none;
                -moz-appearance: none;
                cursor: pointer;
                background-image: url("data:image/svg+xml;utf8,<svg fill='%236b7280' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
                background-repeat: no-repeat;
                background-position: right 10px center;
                padding-right: 40px;
            }

            input:hover,
            textarea:hover,
            select:hover {
                border-color: var(--accent);
            }

            input:focus,
            textarea:focus,
            select:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-soft);
            }

            button[type="submit"],
            #newFeedbackBtn {
                background-color: var(--accent);
                color: white;
                border: none;
                padding: 13px 24px;
                border-radius: 999px;
                font-size: 15px;
                font-weight: 650;
                font-family: var(--font);
                cursor: pointer;
                width: 100%;
                transition: background-color 0.15s ease;
            }

            button[type="submit"]:hover,
            #newFeedbackBtn:hover {
                background-color: var(--accent-dark);
            }

            .success-message {
                display: none;
                background-color: var(--surface);
                border: 1px solid var(--border);
                text-align: center;
                padding: 32px;
                border-radius: var(--radius-lg);
            }

            .success-message h2 {
                margin: 0 0 10px;
                font-size: 22px;
            }

            .success-message p {
                color: var(--muted);
                margin: 0 0 22px;
            }
        </style>
    </head>
    <body>
        <header class="site-header" data-cta="home"></header>

        <section class="feedback-shell">
          <div class="wrap">
            <div class="form-container" id="formContainer">
                <p class="form-intro" data-i18n="formIntro">Found a bug or have an idea? Let us know.</p>
                <h1 data-i18n="title">Share Your Feedback</h1>
                <form id="feedbackForm">
                    <div class="form-group">
                        <label for="feedbackType" data-i18n="feedbackType"
                            >Feedback Type</label
                        >
                        <select id="feedbackType" required>
                            <option value="" disabled selected data-i18n="selectType">
                                Select feedback type
                            </option>
                            <option value="bug" data-i18n="bug">Bug Report</option>
                            <option value="enhancement" data-i18n="enhancement">
                                Feature Request
                            </option>
                            <option value="other" data-i18n="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="titleInput" data-i18n="titleLabel">Title</label>
                        <input
                            type="text"
                            id="titleInput"
                            data-i18n-placeholder="titlePlaceholder"
                            placeholder="Brief summary of your feedback"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="description" data-i18n="descriptionLabel"
                            >Description</label
                        >
                        <textarea
                            id="description"
                            data-i18n-placeholder="descriptionPlaceholder"
                            placeholder="Please provide details about your feedback..."
                            required
                            rows="5"
                        ></textarea>
                    </div>

                    <button type="submit" id="submitBtn" data-i18n="submit">
                        Submit Feedback
                    </button>
                </form>
            </div>

            <div class="success-message" id="successMessage">
                <h2 data-i18n="successTitle">Thank You for Your Feedback!</h2>
                <p data-i18n="successMessage">
                    We appreciate your input and will review it shortly.
                </p>
                <button id="newFeedbackBtn" data-i18n="newFeedback">Submit Another Feedback</button>
            </div>
          </div>
        </section>

        <footer class="site-footer"></footer>

        <script>
            window.TRANSLATIONS = {
                en: {
                    formIntro: "Found a bug or have an idea? Let us know.",
                    title: "Share Your Feedback",
                    feedbackType: "Feedback Type",
                    selectType: "Select feedback type",
                    bug: "Bug Report",
                    enhancement: "Feature Request",
                    other: "Other",
                    titleLabel: "Title",
                    titlePlaceholder: "Brief summary of your feedback",
                    descriptionLabel: "Description",
                    descriptionPlaceholder: "Please provide details about your feedback...",
                    submit: "Submit Feedback",
                    successTitle: "Thank You for Your Feedback!",
                    successMessage: "We appreciate your input and will review it shortly.",
                    newFeedback: "Submit Another Feedback",
                },
                de: {
                    formIntro: "Hast du einen Fehler gefunden oder eine Idee? Lass es uns wissen.",
                    title: "Teile dein Feedback",
                    feedbackType: "Feedback-Typ",
                    selectType: "Feedback-Typ auswählen",
                    bug: "Fehler",
                    enhancement: "Neue Funktion",
                    other: "Sonstiges",
                    titleLabel: "Titel",
                    titlePlaceholder: "Kurze Zusammenfassung",
                    descriptionLabel: "Beschreibung",
                    descriptionPlaceholder: "Bitte gebe Details zu deinem Feedback an...",
                    submit: "Feedback senden",
                    successTitle: "Danke für dein Feedback!",
                    successMessage: "Vielen Dank für dein Feedback!",
                    newFeedback: "Weiteres Feedback senden",
                },
            };
        </script>
        <script src="assets/js/header.js"></script>
        <script src="assets/js/footer.js"></script>
        <script src="assets/js/i18n.js"></script>

        <script>
            document
                .getElementById("feedbackForm")
                .addEventListener("submit", async function (e) {
                    e.preventDefault();
                    document.getElementById("submitBtn").disabled = true;

                    const issueTitle =
                        document.getElementById("titleInput").value;
                    const issueDescription =
                        document.getElementById("description").value;
                    const issueType =
                        document.getElementById("feedbackType").value;
                    const currentLang =
                        (document.documentElement.lang || "en").split("-")[0];

                    const githubIssue = {
                        title: issueTitle,
                        body: issueDescription,
                        labels: [
                            issueType,
                            "external-feedback-issue",
                            `lang-${currentLang}`,
                        ],
                    };

                    try {
                        const response = await fetch("/api/create-issue", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(githubIssue),
                        });

                        if (!response.ok) {
                            throw new Error("Failed to submit feedback");
                        }

                        showSuccessMessage();
                    } catch (error) {
                        console.error("Error:", error);
                        alert(
                            "There was an error submitting your feedback. Please try again.",
                        );
                    } finally {
                        document.getElementById("submitBtn").disabled = false;
                    }
                });

            document
                .getElementById("newFeedbackBtn")
                .addEventListener("click", function () {
                    document.getElementById("feedbackForm").reset();
                    document.getElementById("formContainer").style.display =
                        "block";
                    document.getElementById("successMessage").style.display =
                        "none";
                });

            function showSuccessMessage() {
                document.getElementById("formContainer").style.display = "none";
                document.getElementById("successMessage").style.display =
                    "block";
            }
        </script>
    </body>
</html>

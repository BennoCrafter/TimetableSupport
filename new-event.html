<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <title>Import an event...</title>
        <link rel="icon" href="assets/images/favicon.png" type="image/png" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..800&amp;display=swap"
          rel="stylesheet"
        />
        <style>
            body {
                font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                text-align: center;
                margin: 0;
                padding: 80px 20px;
                color: #171a2c;
                background: #fbf8f2;
            }
            button {
                padding: 15px 30px;
                font-size: 17px;
                font-weight: 650;
                background-color: #1e3bb3;
                color: white;
                border: none;
                border-radius: 999px;
                cursor: pointer;
                margin-top: 18px;
                width: 80%;
                max-width: 300px;
            }
            button:hover {
                background-color: #172e8c;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    color: #eef0f6;
                    background: #11131c;
                }
            }
        </style>
        <script>
            // Shared event links open here and are handed to the app via its URL scheme,
            // keeping the query string (event details) intact.
            function redirect() {
                const params = new URLSearchParams(window.location.search);
                window.location.href = `timetablemanager://new-event?${params}`;
            }

            window.onload = redirect;
        </script>
    </head>
    <body>
        <div style="font-size: 20px">Redirecting...</div>
        <div>
            <button onclick="redirect()">Click to Redirect manually</button>
        </div>
    </body>
</html>

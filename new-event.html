<!doctype html>
<html>
    <head>
        <title>Import an event...</title>
        <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap"
          rel="stylesheet"
        />
        <style>
            body {
                font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                text-align: center;
                margin: 0;
                padding: 80px 20px;
                color: #14161f;
                background: #f7f8fb;
            }
            button {
                padding: 15px 30px;
                font-size: 17px;
                font-weight: 650;
                background-color: #3653ff;
                color: white;
                border: none;
                border-radius: 999px;
                cursor: pointer;
                margin-top: 18px;
                width: 80%;
                max-width: 300px;
            }
            button:hover {
                background-color: #2540d1;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    color: #eef0f6;
                    background: #0f1117;
                }
            }
        </style>
        <script>
            window.onload = function () {
                const params = new URLSearchParams(window.location.search);
                console.log(params);
                redirect();
            };

            function redirect() {
                window.location.href = convertURL(window.location.search);
            }

            function convertURL(url) {
                const params = new URLSearchParams(url);
                const redirectUrl = `timetablemanager://new-event?${params}`;
                return redirectUrl;
            }
        </script>
    </head>
    <body>
        <div style="font-size: 20px">Redirecting...</div>
        <div>
            <button onclick="redirect()">Click to Redirect manually</button>
        </div>
    </body>
</html>
